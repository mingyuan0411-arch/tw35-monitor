
name: TW 3-5 Percent Monitor

on:
  schedule:
    # 台股盤中每10分鐘跑一次
    # GitHub Actions cron 使用 UTC
    # 台灣時間 09:00~13:30 = UTC 01:00~05:30
    #
    # 這裡設定 UTC 01:00~05:50 每10分鐘
    # 程式本身還會再檢查台股交易時段
    - cron: "*/10 1-5 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tw35-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore TW35 state
        uses: actions/cache/restore@v4
        with:
          path: .tw35_state
          key: tw35-state-${{ github.run_id }}
          restore-keys: |
            tw35-state-

      - name: Run TW35 monitor
        env:
          NTFY_TOPIC_TW35: ${{ secrets.NTFY_TOPIC_TW35 }}
          NTFY_SERVER: https://ntfy.sh
          GITHUB_EVENT_NAME: ${{ github.event_name }}

        run: |
          python tw35_monitor.py

      - name: Save TW35 state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .tw35_state
          key: tw35-state-${{ github.run_id }}
